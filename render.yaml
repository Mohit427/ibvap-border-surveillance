# Render Blueprint - lets "Deploy to Render" build straight from the
# Dockerfile with no extra setup. Free plan: 512MB RAM, sleeps after 15 min
# idle, no credit card required. See README "Live demo deployment".
services:
  - type: web
    name: ibvap-border-surveillance
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/state
    envVars:
      - key: IBVAP_HOST
        value: 0.0.0.0
      - key: IBVAP_OPEN_BROWSER
        value: "0"
      # ANPR (EasyOCR) is the heaviest module and the one most likely to
      # stall a shared free-tier vCPU - off by default here, visitors can
      # still switch it on from the dashboard (bounded by a 6s timeout so
      # it can no longer freeze the whole feed if it stalls again).
      - key: IBVAP_ANPR_DEFAULT
        value: "0"
      # Smaller processing/streamed frame = cheaper inference per frame.
      - key: IBVAP_PROCESS_WIDTH
        value: "480"
      # Caps YOLO's internal inference size independently of the streamed
      # frame size above - results still get rescaled back to full size.
      - key: IBVAP_YOLO_IMGSZ
        value: "320"
      # Run YOLO detection/tracking every 2nd frame and face detection
      # every 3rd, reusing the last boxes in between. Video still streams
      # every frame - only how often box positions refresh changes. This
      # is the single biggest lever on a throttled shared free-tier vCPU.
      - key: IBVAP_DETECT_INTERVAL
        value: "2"
      - key: IBVAP_FACE_INTERVAL
        value: "3"
